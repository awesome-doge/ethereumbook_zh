name: Publish AsciiDoc to GitHub Pages

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # sitemap 的 lastmod 取自各章最後一次 commit 的時間

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Install dependencies
      run: |
        gem install asciidoctor -v '~> 2.0' --no-document
        gem install rouge nokogiri --no-document
        sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends webp

    - name: Build site
      # 每章一頁的線上閱讀網站，加上首頁、搜尋索引、sitemap 與 llms.txt（見 scripts/build-site.rb）
      run: STRICT_LINKS=1 WRITE_CNAME=1 ruby scripts/build-site.rb output

    - name: Check site
      run: ruby scripts/check-site.rb output

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./output
