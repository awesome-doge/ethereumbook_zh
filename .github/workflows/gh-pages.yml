name: Publish AsciiDoc to GitHub Pages

on:
  push:
    branches:
      - master

env:
  # 第二版的譯稿以 pandoc 轉成 AsciiDoc（scripts/md2adoc.rb）。標題 ID 依賴 pandoc 的自動 ID 規則，
  # 換版本可能改變網址錨點，所以固定版本，與本機開發用的版本一致；升級時連同 translation/ids-snapshot.json 一起確認
  PANDOC_VERSION: '3.13'
  PANDOC_SHA256: 7e3736f255090296ca5d1a14291a76b9b3c43cd385011b1621a4d0c16091a70f

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # sitemap 的 lastmod 取自各章最後一次 commit 的時間

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Install dependencies
      run: |
        gem install asciidoctor -v '~> 2.0' --no-document
        gem install rouge nokogiri --no-document
        sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends webp

    - name: Install pandoc ${{ env.PANDOC_VERSION }}
      run: |
        deb="pandoc-${PANDOC_VERSION}-1-amd64.deb"
        curl -fsSL -o "/tmp/$deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/$deb"
        echo "${PANDOC_SHA256}  /tmp/$deb" | sha256sum -c -
        sudo dpkg -i "/tmp/$deb"
        pandoc --version | head -1

    - name: Build site
      # 整個網站：第二版在根部、2018 草稿譯本在 /2018/、舊網址轉址頁，加上搜尋索引、sitemap 與 llms.txt（見 scripts/build-site.rb）
      run: STRICT_LINKS=1 WRITE_CNAME=1 ruby scripts/build-site.rb output

    - name: Check translation
      # 譯稿與上游原稿的結構比對、術語表與禁用詞
      run: ruby scripts/check-translation.rb --strict

    - name: Check site
      run: |
        ruby scripts/check-site.rb output
        python3 scripts/md2adoc/leaks.py output

    - name: Fetch deployed sitemap
      # 部署前先取下線上的 sitemap，部署後只把 lastmod 改變的網址通知搜尋引擎
      run: curl -fsSL -o /tmp/sitemap-before.xml https://mastering-ethereum.doge.tg/sitemap.xml || true

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./output

    - name: Notify search engines (IndexNow)
      # Bing、Yandex 等搜尋引擎即時收錄；GitHub Pages 部署要一點時間，先等金鑰檔與新頁面上線
      run: |
        sleep 90
        ruby scripts/indexnow.rb output/sitemap.xml /tmp/sitemap-before.xml
